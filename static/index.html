<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세나봇 · 길드전 공략</title>
<style>
  /* ===== 색상 변수 (다크 테마) ===== */
  :root {
    --bg: #14151a;
    --panel: #1b1d24;
    --panel-hover: #22242c;
    --border: #2c2f38;
    --gold: #d4a656;
    --gold-dim: #8a6f3d;
    --text: #e8e6e0;
    --text-dim: #8b8d97;
    --danger: #c1584f;
    --ok: #5fa876;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    min-height: 100vh;
  }

  /* ===== 로그인 / 회원가입 화면 ===== */
  #lockScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  #lockScreen .lock-box {
    display: flex; flex-direction: column; gap: 12px; width: 280px; max-width: 100%;
  }
  #lockScreen .lock-title { color: var(--gold); font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 6px; }
  #lockScreen input {
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    padding: 12px 16px; color: var(--text); font-size: 14px; width: 100%; text-align: center;
  }
  #lockScreen input:focus { outline: none; border-color: var(--gold-dim); }
  #lockScreen button.primary-btn {
    background: var(--gold); color: #1a1a1a; border: none; border-radius: 5px;
    padding: 10px 24px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #lockScreen button.primary-btn:disabled { opacity: .5; }
  #lockScreen .switch-mode {
    background: none; border: none; color: var(--text-dim); font-size: 12.5px;
    cursor: pointer; text-decoration: underline; margin-top: 4px;
  }
  #lockScreen .switch-mode:hover { color: var(--gold); }
  #lockMsg { font-size: 12.5px; min-height: 16px; text-align: center; }
  #lockMsg.err { color: var(--danger); }
  #lockMsg.ok { color: var(--ok); }
  #signupFields { display: none; flex-direction: column; gap: 12px; }
  #signupFields.active { display: flex; }
  #loginFields { display: flex; flex-direction: column; gap: 12px; }
  #loginFields.hidden { display: none; }

  /* ===== 상단바 ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #191a20, #14151a);
  }
  .emblem {
    width: 34px; height: 34px;
    border: 1.5px solid var(--gold);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .emblem::after { content: ""; width: 10px; height: 10px; background: var(--gold); }
  .topbar h1 { font-size: 18px; letter-spacing: 0.02em; margin: 0; font-weight: 600; }
  .topbar .sub { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .logout-btn {
    margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* ===== 탭 메뉴 ===== */
  .tabs {
    display: flex; gap: 2px; padding: 0 28px;
    border-bottom: 1px solid var(--border); background: var(--bg);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    padding: 13px 18px; color: var(--text-dim); cursor: pointer;
    font-size: 14px; border-bottom: 2px solid transparent; user-select: none; transition: color .15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 28px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ===== 마스터-디테일 레이아웃 (가이드 보기 / 덱 수정 / 강림 / 돌발레이드 공용) ===== */
  .split { display: flex; gap: 16px; height: 68vh; }
  .deck-list {
    width: 240px; flex-shrink: 0; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; overflow-y: auto;
  }
  .deck-list-item {
    padding: 10px 14px; font-size: 13px; color: var(--text-dim);
    cursor: pointer; border-left: 2px solid transparent;
  }
  .deck-list-item:hover { background: var(--panel-hover); color: var(--text); }
  .deck-list-item.selected {
    background: var(--panel-hover); color: var(--gold); border-left: 2px solid var(--gold);
  }
  .search-box { padding: 10px; border-bottom: 1px solid var(--border); }
  .search-box input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 7px 10px; color: var(--text); font-size: 12.5px;
  }
  .search-box input:focus { outline: none; border-color: var(--gold-dim); }
  .new-deck-box { padding: 10px; border-bottom: 1px solid var(--border); }

  .detail-panel {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 22px 24px; overflow-y: auto; min-width: 0;
  }
  .detail-empty { color: var(--text-dim); font-size: 13.5px; text-align: center; margin-top: 40%; }
  .detail-name { color: var(--gold); font-size: 19px; font-weight: 600; margin-bottom: 18px; }
  .detail-field { margin-bottom: 18px; }
  .detail-field-label { color: var(--text); font-size: 12.5px; font-weight: 600; margin-bottom: 6px; letter-spacing: .02em; }
  .detail-field-value { color: var(--text-dim); font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--panel-hover); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px; font-size: 12.5px; color: var(--text);
  }

  /* ===== 덱 수정/추가 / 레이드 편집 공용 폼 스타일 ===== */
  .edit-form label { display: block; color: var(--text); font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  .edit-form label:first-child { margin-top: 0; }
  .edit-form input[type=text], .edit-form textarea, .plain-textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 9px 11px; color: var(--text); font-size: 13.5px;
    font-family: inherit; resize: vertical;
  }
  .edit-form input:focus, .edit-form textarea:focus, .plain-textarea:focus { outline: none; border-color: var(--gold-dim); }
  .edit-form .field-hint { color: var(--text-dim); font-size: 11.5px; margin-top: 4px; }
  .save-btn {
    background: var(--gold); color: #1a1a1a; border: none; border-radius: 5px;
    padding: 10px 24px; font-weight: 600; font-size: 13.5px; cursor: pointer; margin-top: 18px;
  }
  .save-btn:disabled { opacity: .5; cursor: default; }
  .danger-save-btn { background: var(--danger); color: #fff; }
  .btn-row { display: flex; gap: 10px; }
  .save-status { font-size: 12.5px; margin-top: 10px; }
  .save-status.ok { color: var(--ok); }
  .save-status.err { color: var(--danger); }
  .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

  /* ===== 챗봇 뷰 ===== */
  .chat-log {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    height: 55vh; overflow-y: auto; padding: 18px; margin-bottom: 12px;
  }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--gold-dim); color: #1a1a1a; }
  .msg.bot .bubble { background: var(--panel-hover); border: 1px solid var(--border); }
  .msg.bot .bubble.pending { color: var(--text-dim); font-style: italic; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    padding: 12px 14px; color: var(--text); font-size: 14px; min-width: 0;
  }
  .chat-input-row input:focus { outline: none; border-color: var(--gold-dim); }
  .chat-input-row button {
    background: var(--gold); color: #1a1a1a; border: none; border-radius: 5px;
    padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .chat-input-row button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    padding: 4px 10px; border-radius: 4px; font-size: 11.5px; cursor: pointer; flex-shrink: 0;
  }
  .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* ===== 정정 내역 (통합 이력) 뷰 ===== */
  .correction-item {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold-dim);
    border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; font-size: 13.5px;
  }
  .correction-item .deck-title { color: var(--gold); font-weight: 600; margin-bottom: 4px; }
  .correction-item .type-badge {
    display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 10px;
    margin-left: 8px; vertical-align: middle; font-weight: 600;
  }
  /* 이력 종류별 배지 색상: 수정=금색, 추가=초록, 삭제=빨강, 메모=초록(연함), 레이드=빨강(연함) */
  .type-badge.deck { background: rgba(212,166,86,.18); color: var(--gold); }
  .type-badge.deck_create { background: rgba(95,168,118,.18); color: var(--ok); }
  .type-badge.deck_delete { background: rgba(193,88,79,.18); color: var(--danger); }
  .type-badge.memo { background: rgba(95,168,118,.18); color: var(--ok); }
  .type-badge.raid { background: rgba(193,88,79,.18); color: var(--danger); }
  .correction-item .timestamp { color: var(--text-dim); font-size: 11.5px; margin-bottom: 6px; }
  .correction-item .changed { color: var(--ok); }
  .empty-state { color: var(--text-dim); font-size: 13.5px; padding: 24px; text-align: center; }

  /* ===== 메모장 / 레이드 단일페이지 공용 ===== */
  .full-textarea {
    width: 100%; min-height: 50vh; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 16px; color: var(--text); font-size: 14px; font-family: inherit; resize: vertical;
  }

  /* ===== 관리자 전용: 사용자 관리 뷰 ===== */
  .admin-gate { display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
  .admin-gate input {
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    padding: 10px 14px; color: var(--text); font-size: 14px;
  }
  .admin-gate button {
    background: var(--gold); color: #1a1a1a; border: none; border-radius: 5px;
    padding: 10px 20px; font-weight: 600; font-size: 13.5px; cursor: pointer;
  }
  .pending-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    padding: 12px 16px; margin-bottom: 8px; font-size: 13.5px;
  }
  .pending-item button {
    background: var(--ok); color: #14151a; border: none; border-radius: 4px;
    padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .pending-item button.danger-btn { background: var(--danger); color: #fff; }
  .admin-section-title { color: var(--gold); font-size: 15px; margin-bottom: 14px; }

  /* ===== 모바일 반응형 ===== */
  @media (max-width: 768px) {
    .topbar { padding: 14px 16px; gap: 10px; }
    .topbar h1 { font-size: 16px; }
    .topbar .sub { font-size: 11px; }
    .emblem { width: 28px; height: 28px; }
    .logout-btn { padding: 5px 10px; font-size: 11px; }

    .tabs { padding: 0 12px; }
    .tab { padding: 11px 12px; font-size: 13px; }

    main { padding: 14px 12px; }

    .split { flex-direction: column; height: auto; }
    .deck-list { width: 100%; max-height: 220px; }
    .detail-panel { padding: 16px; max-height: 60vh; }
    .detail-empty { margin-top: 20%; }

    .chat-log { height: 60vh; padding: 12px; }
    .bubble { max-width: 88%; font-size: 13.5px; }
    .chat-input-row input { padding: 10px 12px; font-size: 13.5px; }
    .chat-input-row button { padding: 0 14px; font-size: 13.5px; }

    .hint { font-size: 11px; }

    #lockScreen .lock-box { width: 100%; max-width: 300px; }

    .pending-item { flex-direction: column; align-items: flex-start; gap: 8px; }
  }

  @media (max-width: 420px) {
    .topbar h1 { font-size: 15px; }
    .tab { padding: 10px 9px; font-size: 12.5px; }
    .bubble { max-width: 92%; }
  }
</style>
</head>
<body>

<!-- ============================================================
     로그인 / 회원가입 화면
============================================================= -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">세나봇 접속</div>

    <div id="loginFields">
      <input id="loginUsername" type="text" placeholder="아이디" autocomplete="off" />
      <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="off" />
      <button class="primary-btn" id="loginBtn">로그인</button>
      <button class="switch-mode" id="showSignupBtn">계정이 없으신가요? 회원가입</button>
    </div>

    <div id="signupFields">
      <input id="signupUsername" type="text" placeholder="사용할 아이디" autocomplete="off" />
      <input id="signupPassword" type="password" placeholder="사용할 비밀번호 (4자 이상)" autocomplete="off" />
      <button class="primary-btn" id="signupBtn">가입 신청</button>
      <button class="switch-mode" id="showLoginBtn">이미 계정이 있으신가요? 로그인</button>
    </div>

    <div id="lockMsg"></div>
  </div>
</div>

<!-- ============================================================
     메인 앱 화면 (로그인 성공 후에만 표시)
============================================================= -->
<div id="appContent" style="display: none;">

  <div class="topbar">
    <div class="emblem"></div>
    <div>
      <h1>세나봇</h1>
      <div class="sub">길드전 공격팀 세팅 가이드 · 질의응답 &amp; 수정</div>
    </div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="chat">챗봇</div>
    <div class="tab" data-view="guide">가이드 보기</div>
    <div class="tab" data-view="edit">덱 수정</div> 
    <div class="tab" data-view="raid-강림">강림</div>
    <div class="tab" data-view="raid-파괴신">파괴신</div>
    <div class="tab" data-view="raid-돌발레이드">돌발레이드</div>
    <div class="tab" id="memoTab" data-view="memo" style="display:none;">메모장</div>
    <div class="tab" id="adminTab" data-view="admin" style="display:none;">사용자 관리</div>
    <div class="tab" data-view="corrections">정정 내역</div>
    <div class="tab" id="logTab" data-view="activitylog" style="display:none;">활동 로그</div>
  </div>

  <main>

    <!-- ---------- 챗봇 탭 ---------- -->
    <section id="view-chat" class="view active">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="예: 밀실스 카운터 조합 알려줘" />
        <button id="sendBtn">전송</button>
      </div>
      <div class="hint">
        <span>덱 정보 자체를 고치려면 "덱 수정" 탭을 이용하세요.</span>
        <button class="clear-btn" id="clearChatBtn">대화 지우기</button>
      </div>
    </section>

    <!-- ---------- 가이드 보기 탭 (읽기 전용) ---------- -->
    <section id="view-guide" class="view">
      <div class="split">
        <div class="deck-list">
          <div class="search-box"><input id="guideSearch" type="text" placeholder="덱 이름 검색... (순서 상관없음)" /></div>
          <div id="guideListItems"></div>
        </div>
        <div class="detail-panel" id="guideDetail">
          <div class="detail-empty">위/왼쪽에서 덱을 선택하세요</div>
        </div>
      </div>
    </section>

    <!-- ---------- 덱 수정 탭 (편집 / 추가 / 삭제) ---------- -->
    <section id="view-edit" class="view">
      <div class="split">
        <div class="deck-list">
          <div class="search-box"><input id="editSearch" type="text" placeholder="덱 이름 검색... (순서 상관없음)" /></div>
          <!-- 새 덱 추가 버튼: 누르면 오른쪽에 빈 입력 폼이 뜬다 -->
          <div class="new-deck-box">
            <button class="save-btn" id="newDeckBtn" style="margin-top:0; width:100%;">+ 새 덱 추가</button>
          </div>
          <div id="editListItems"></div>
        </div>
        <div class="detail-panel" id="editDetail">
          <div class="detail-empty">위/왼쪽에서 수정할 덱을 선택하세요</div>
        </div>
      </div>
    </section>

    <!-- ---------- 정정 내역 탭 (통합 이력: 덱 수정/추가/삭제, 메모, 레이드) ---------- -->
    <section id="view-corrections" class="view">
      <div id="correctionsList"></div>
    </section>

    <!-- ---------- 강림 탭 (보스별 목록형: 태오/카일/연희/카르마) ---------- -->
    <section id="view-raid-강림" class="view">
      <div class="split">
        <div class="deck-list" id="raidList-강림"></div>
        <div class="detail-panel" id="raidDetail-강림">
          <div class="detail-empty">왼쪽에서 보스를 선택하세요</div>
        </div>
      </div>
    </section>

    <!-- ---------- 파괴신 탭 (단일 공략 페이지, 목록 없음) ---------- -->
    <section id="view-raid-파괴신" class="view">
      <textarea id="raidSingleTextarea-파괴신" class="full-textarea" placeholder="파괴신 공략 내용을 작성하세요"></textarea>
      <div class="footer-row">
        <div id="raidSingleStatus-파괴신" style="font-size:12.5px;"></div>
        <button class="save-btn" id="raidSingleSaveBtn-파괴신" style="margin-top:0;">저장</button>
      </div>
    </section>

    <!-- ---------- 돌발레이드 탭 (보스별 목록형: 칼리스트라/아스트레아/레오니드) ---------- -->
    <section id="view-raid-돌발레이드" class="view">
      <div class="split">
        <div class="deck-list" id="raidList-돌발레이드"></div>
        <div class="detail-panel" id="raidDetail-돌발레이드">
          <div class="detail-empty">왼쪽에서 보스를 선택하세요</div>
        </div>
      </div>
    </section>

    <!-- ---------- 메모장 탭 (admin 전용) ---------- -->
    <section id="view-memo" class="view">
      <textarea id="memoTextarea" class="full-textarea" placeholder="수정하고 싶은 내용을 자유롭게 적어두세요. 길드원 전체가 함께 보는 메모장입니다."></textarea>
      <div class="footer-row">
        <div id="memoStatus" style="font-size:12.5px;"></div>
        <button class="save-btn" id="saveMemoBtn" style="margin-top:0;">저장</button>
      </div>
    </section>

    <!-- ---------- 사용자 관리 탭 (admin 전용) ---------- -->
    <section id="view-admin" class="view">
      <h3 class="admin-section-title">승인 대기 중인 사용자</h3>
      <div id="pendingList"></div>

      <h3 class="admin-section-title" style="margin-top:24px;">전체 회원 목록</h3>
      <div id="allUsersList"></div>

    </section>

    <!-- ---------- 활동 로그 탭 (admin 전용) ---------- -->
    <section id="view-activitylog" class="view">
      <div style="margin-bottom:14px;">
        <select id="logUserFilter" style="background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 8px 12px; color: var(--text); font-size: 13px;">
          <option value="">전체 계정</option>
        </select>
      </div>
      <div id="activityLogList"></div>
    </section>

  </main>

</div>

<script>
/* ============================================================
   1. 로그인 / 회원가입 처리
============================================================= */
const loginFields = document.getElementById('loginFields');
const signupFields = document.getElementById('signupFields');
const lockMsg = document.getElementById('lockMsg');

function setLockMsg(text, type) {
  lockMsg.textContent = text;
  lockMsg.className = type || '';
}

// 로그인 <-> 회원가입 화면 전환
document.getElementById('showSignupBtn').addEventListener('click', () => {
  loginFields.classList.add('hidden');
  signupFields.classList.add('active');
  setLockMsg('');
});
document.getElementById('showLoginBtn').addEventListener('click', () => {
  signupFields.classList.remove('active');
  loginFields.classList.remove('hidden');
  setLockMsg('');
});

// 회원가입 신청: 서버에 아이디/비밀번호 등록 (승인 대기 상태로 생성됨)
document.getElementById('signupBtn').addEventListener('click', async () => {
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  if (!username || !password) {
    setLockMsg('아이디와 비밀번호를 모두 입력해주세요.', 'err');
    return;
  }
  try {
    const res = await fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    setLockMsg(data.message, 'ok');
    signupFields.classList.remove('active');
    loginFields.classList.remove('hidden');
  } catch (e) {
    setLockMsg(e.message, 'err');
  }
});

// 로그인 시도. silent=true면 실패해도 에러 메시지를 안 띄움 (자동 로그인 시도용)
async function doLogin(username, password, silent) {
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    // 로그인 성공 시 브라우저에 저장 -> 다음 방문 때 자동 로그인 + 모든 저장 작업에 재사용
    localStorage.setItem('sena_bot_username', username);
    localStorage.setItem('sena_bot_userpw', password);
    showApp();
    return true;
  } catch (e) {
    if (!silent) setLockMsg(e.message, 'err');
    return false;
  }
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) {
    setLockMsg('아이디와 비밀번호를 입력해주세요.', 'err');
    return;
  }
  doLogin(username, password);
});

// Enter 키로도 로그인/가입 가능하게. isComposing 체크로 한글 입력 중 중복 전송 방지
[document.getElementById('loginUsername'), document.getElementById('loginPassword')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) document.getElementById('loginBtn').click(); });
});
[document.getElementById('signupUsername'), document.getElementById('signupPassword')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) document.getElementById('signupBtn').click(); });
});

// 페이지 로드 시: 저장된 로그인 정보가 있으면 자동 로그인 시도, 없으면 잠금화면 표시
async function checkAccess() {
  const savedUser = localStorage.getItem('sena_bot_username');
  const savedPw = localStorage.getItem('sena_bot_userpw');
  if (savedUser && savedPw) {
    const ok = await doLogin(savedUser, savedPw, true);
    if (ok) return;
  }
  document.getElementById('lockScreen').style.display = 'flex';
}

function showApp() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  initApp();
}

checkAccess();


/* ============================================================
   2. 메인 앱 초기화 (로그인 성공 후 1회만 실행)
============================================================= */
let guideDataCache = null;
let raidDataCache = null;
let appInitialized = false;

// 저장/추가/삭제 요청마다 필요한 로그인 정보를 한 번에 꺼내는 헬퍼
function getAuth() {
  return {
    username: localStorage.getItem('sena_bot_username'),
    password: localStorage.getItem('sena_bot_userpw'),
  };
}

function initApp() {
  if (appInitialized) return;
  appInitialized = true;

  // 로그아웃: 저장된 로그인 정보를 지우고 새로고침
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('sena_bot_username');
    localStorage.removeItem('sena_bot_userpw');
    location.reload();
  });

  // admin 계정으로 로그인했을 때만 "메모장", "사용자 관리" 탭을 보이게 함
  const currentUsername = localStorage.getItem('sena_bot_username');
  if (currentUsername === 'admin') {
    document.getElementById('adminTab').style.display = 'block';
    document.getElementById('memoTab').style.display = 'block';
    document.getElementById('logTab').style.display = 'block';   // 추가
  }

  // 탭 전환 처리: 클릭한 탭에 맞는 뷰를 보여주고, 필요하면 데이터를 새로 불러옴
  const tabs = document.querySelectorAll('.tab');
  const views = document.querySelectorAll('.view');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      views.forEach(v => v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('view-' + tab.dataset.view).classList.add('active');
      if (tab.dataset.view === 'guide') loadGuide('guide');
      if (tab.dataset.view === 'edit') loadGuide('edit');
      if (tab.dataset.view === 'corrections') loadCorrections();
      if (tab.dataset.view === 'memo') loadMemo();
      if (tab.dataset.view === 'raid-강림') loadRaidList('강림');
      if (tab.dataset.view === 'raid-돌발레이드') loadRaidList('돌발레이드');
      if (tab.dataset.view === 'raid-파괴신') loadRaidSingle('파괴신');
      if (tab.dataset.view === 'admin') loadAdminData();
      if (tab.dataset.view === 'activitylog') loadActivityLogData();   
    });
  });

  /* -------------------- 3. 챗봇 -------------------- */
  const chatLog = document.getElementById('chatLog');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const clearChatBtn = document.getElementById('clearChatBtn');

  // 대화 내용을 localStorage에 저장/복원 (새로고침해도 유지됨)
  function saveChatHistory() { localStorage.setItem('sena_bot_chat_history', chatLog.innerHTML); }
  function loadChatHistory() {
    const saved = localStorage.getItem('sena_bot_chat_history');
    if (saved) { chatLog.innerHTML = saved; chatLog.scrollTop = chatLog.scrollHeight; }
  }
  loadChatHistory();

  clearChatBtn.addEventListener('click', () => {
    chatLog.innerHTML = '';
    localStorage.removeItem('sena_bot_chat_history');
  });

  function addMessage(text, who, pending = false) {
    const row = document.createElement('div');
    row.className = 'msg ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (pending ? ' pending' : '');
    bubble.textContent = text;
    row.appendChild(bubble);
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
    saveChatHistory();
    return bubble;
  }

  // 메시지 전송: /chat 호출, 30초 넘게 응답 없으면 타임아웃 처리
  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    sendBtn.disabled = true;
    addMessage(text, 'user');
    const pendingBubble = addMessage('생각 중...', 'bot', true);

    const timeoutId = setTimeout(() => {
      pendingBubble.textContent = '응답 시간이 초과됐습니다. 서버가 혼잡할 수 있어요. 잠시 후 다시 시도해주세요.';
      pendingBubble.classList.remove('pending');
      saveChatHistory();
      sendBtn.disabled = false;
    }, 30000);

    const { username } = getAuth();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, username: username })
      });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error('서버 오류: ' + res.status);
      const data = await res.json();
      pendingBubble.textContent = data.answer;
      pendingBubble.classList.remove('pending');
    } catch (e) {
      clearTimeout(timeoutId);
      pendingBubble.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해주세요. (' + e.message + ')';
      pendingBubble.classList.remove('pending');
    } finally {
      saveChatHistory();
      sendBtn.disabled = false;
    }
  }
  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) sendMessage(); });

  /* -------------------- 4. 가이드 보기 / 덱 수정·추가·삭제 -------------------- */

  // /guide 데이터를 최초 1회만 불러와서 캐싱, 이후에는 캐시 재사용
  window.loadGuide = async function(mode) {
    if (!guideDataCache) {
      const res = await fetch('/guide');
      const data = await res.json();
      guideDataCache = data.guide_data;
    }
    renderDeckList(mode);
  };

  // 문자열의 글자를 정렬해서 반환 -> 순서 상관없이 같은 글자 조합이면 매칭되게 함
  function normalize(str) { return str.split('').sort().join(''); }

  // 왼쪽 덱 목록을 검색어에 맞게 필터링해서 렌더링
  function renderDeckList(mode) {
    const listEl = document.getElementById(mode === 'guide' ? 'guideListItems' : 'editListItems');
    const searchEl = document.getElementById(mode === 'guide' ? 'guideSearch' : 'editSearch');
    const keyword = (searchEl.value || '').trim();
    const normalizedKeyword = normalize(keyword);

    const names = Object.keys(guideDataCache).filter(n =>
      n.includes(keyword) || (normalizedKeyword && normalize(n).includes(normalizedKeyword))
    ).sort();

    listEl.innerHTML = names.map(name =>
      `<div class="deck-list-item" data-deck="${name}">${name}</div>`
    ).join('') || '<div class="empty-state">일치하는 덱이 없습니다.</div>';

    listEl.querySelectorAll('.deck-list-item').forEach(item => {
      item.addEventListener('click', () => {
        listEl.querySelectorAll('.deck-list-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        if (mode === 'guide') renderGuideDetail(item.dataset.deck);
        else renderEditForm(item.dataset.deck);
      });
    });
  }

  document.getElementById('guideSearch').addEventListener('input', () => renderDeckList('guide'));
  document.getElementById('editSearch').addEventListener('input', () => renderDeckList('edit'));

  // "가이드 보기" 탭: 읽기 전용으로 덱 상세정보 표시
  function renderGuideDetail(deckName) {
    const d = guideDataCache[deckName];
    const detail = document.getElementById('guideDetail');
    const counters = d.counter_decks && d.counter_decks.length
      ? `<div class="chip-row">${d.counter_decks.map(c => `<span class="chip">${c}</span>`).join('')}</div>`
      : '<div class="detail-field-value">-</div>';

    detail.innerHTML = `
      <div class="detail-name">${deckName}</div>
      <div class="detail-field"><div class="detail-field-label">카운터 조합</div>${counters}</div>
      <div class="detail-field"><div class="detail-field-label">우선순위</div><div class="detail-field-value">${d.priority_note || '-'}</div></div>
      <div class="detail-field"><div class="detail-field-label">장비 세팅</div><div class="detail-field-value">${d.equipment || '-'}</div></div>
      <div class="detail-field"><div class="detail-field-label">메모</div><div class="detail-field-value">${d.notes || '-'}</div></div>
    `;
  }

  // "덱 수정" 탭: 기존 덱을 선택했을 때 편집 폼 (저장 + 삭제 버튼 포함)
  function renderEditForm(deckName) {
    const d = guideDataCache[deckName];
    const detail = document.getElementById('editDetail');
    const counterText = (d.counter_decks || []).join(', ');

    detail.innerHTML = `
      <div class="detail-name">${deckName}</div>
      <div class="edit-form">
        <label>카운터 조합</label>
        <input type="text" id="f-counters" value="${counterText.replace(/"/g, '&quot;')}" />
        <div class="field-hint">쉼표(,)로 구분해서 입력하세요</div>
        <label>우선순위</label>
        <textarea id="f-priority" rows="2">${d.priority_note || ''}</textarea>
        <label>장비 세팅</label>
        <textarea id="f-equipment" rows="2">${d.equipment || ''}</textarea>
        <label>메모</label>
        <textarea id="f-notes" rows="4">${d.notes || ''}</textarea>
        <div class="btn-row">
          <button class="save-btn" id="saveDeckBtn">저장</button>
          <button class="save-btn danger-save-btn" id="deleteDeckBtn">삭제</button>
        </div>
        <div class="save-status" id="saveStatus"></div>
      </div>
    `;
    document.getElementById('saveDeckBtn').addEventListener('click', () => saveDeck(deckName));
    document.getElementById('deleteDeckBtn').addEventListener('click', () => deleteDeck(deckName));
  }

  // 기존 덱 수정 내용을 서버에 PUT 요청으로 저장
  async function saveDeck(deckName) {
    const btn = document.getElementById('saveDeckBtn');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    status.textContent = '';

    const { username, password } = getAuth();
    if (!username || !password) {
      status.textContent = '로그인이 필요합니다.';
      status.className = 'save-status err';
      btn.disabled = false;
      return;
    }

    const payload = {
      counter_decks: document.getElementById('f-counters').value.split(',').map(s => s.trim()).filter(Boolean),
      priority_note: document.getElementById('f-priority').value,
      equipment: document.getElementById('f-equipment').value,
      notes: document.getElementById('f-notes').value,
      username: username,
      password: password,
    };

    try {
      const res = await fetch('/guide/' + encodeURIComponent(deckName), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        if (res.status === 403) throw new Error('권한이 없습니다.');
        throw new Error();
      }
      guideDataCache[deckName] = payload;
      status.textContent = '저장되었습니다.';
      status.className = 'save-status ok';
    } catch (e) {
      status.textContent = e.message || '저장에 실패했습니다.';
      status.className = 'save-status err';
    } finally {
      btn.disabled = false;
    }
  }

  // 덱 삭제: 확인창을 거친 뒤 DELETE 요청, 성공하면 캐시와 목록에서도 제거
  async function deleteDeck(deckName) {
    if (!confirm(`'${deckName}' 덱을 정말 삭제하시겠습니까? 되돌릴 수 없습니다.`)) return;

    const { username, password } = getAuth();
    if (!username || !password) {
      alert('로그인이 필요합니다.');
      return;
    }

    try {
      const res = await fetch('/guide/' + encodeURIComponent(deckName), {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) throw new Error();
      delete guideDataCache[deckName];
      renderDeckList('edit');
      document.getElementById('editDetail').innerHTML = '<div class="detail-empty">위/왼쪽에서 수정할 덱을 선택하세요</div>';
    } catch (e) {
      alert('삭제에 실패했습니다.');
    }
  }

  // "+ 새 덱 추가" 버튼: 빈 입력 폼을 오른쪽에 표시
  function renderNewDeckForm() {
    const detail = document.getElementById('editDetail');
    detail.innerHTML = `
      <div class="detail-name">새 덱 추가</div>
      <div class="edit-form">
        <label>덱 이름</label>
        <input type="text" id="f-new-name" placeholder="예: 여델칼" />
        <label>카운터 조합</label>
        <input type="text" id="f-counters" placeholder="쉼표(,)로 구분" />
        <div class="field-hint">쉼표(,)로 구분해서 입력하세요</div>
        <label>우선순위</label>
        <textarea id="f-priority" rows="2"></textarea>
        <label>장비 세팅</label>
        <textarea id="f-equipment" rows="2"></textarea>
        <label>메모</label>
        <textarea id="f-notes" rows="4"></textarea>
        <button class="save-btn" id="createDeckBtn">추가</button>
        <div class="save-status" id="saveStatus"></div>
      </div>
    `;
    document.getElementById('createDeckBtn').addEventListener('click', createDeck);
  }

  // 새 덱을 서버에 POST 요청으로 등록
  async function createDeck() {
    const status = document.getElementById('saveStatus');
    const deckName = document.getElementById('f-new-name').value.trim();
    if (!deckName) {
      status.textContent = '덱 이름을 입력해주세요.';
      status.className = 'save-status err';
      return;
    }

    const { username, password } = getAuth();
    if (!username || !password) {
      status.textContent = '로그인이 필요합니다.';
      status.className = 'save-status err';
      return;
    }

    const payload = {
      deck_name: deckName,
      counter_decks: document.getElementById('f-counters').value.split(',').map(s => s.trim()).filter(Boolean),
      priority_note: document.getElementById('f-priority').value,
      equipment: document.getElementById('f-equipment').value,
      notes: document.getElementById('f-notes').value,
      username: username,
      password: password,
    };

    try {
      const res = await fetch('/guide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail);
      guideDataCache[deckName] = {
        counter_decks: payload.counter_decks,
        priority_note: payload.priority_note,
        equipment: payload.equipment,
        notes: payload.notes,
      };
      renderDeckList('edit');
      status.textContent = '추가되었습니다.';
      status.className = 'save-status ok';
    } catch (e) {
      status.textContent = e.message || '추가에 실패했습니다.';
      status.className = 'save-status err';
    }
  }

  document.getElementById('newDeckBtn').addEventListener('click', renderNewDeckForm);

  /* -------------------- 5. 정정 내역 (통합 이력: 덱 수정/추가/삭제, 메모, 레이드) -------------------- */
  window.loadCorrections = async function() {
    const list = document.getElementById('correctionsList');
    list.textContent = '불러오는 중...';
    try {
      const res = await fetch('/corrections');
      const data = await res.json();
      if (!data.length) {
        list.innerHTML = '<div class="empty-state">아직 수정 이력이 없습니다.</div>';
        return;
      }
      const typeLabels = {
        deck: '덱 수정',
        deck_create: '덱 추가',
        deck_delete: '덱 삭제',
        memo: '메모',
        raid: '레이드',
      };
      const fieldLabels = { counter_decks: '카운터 조합', priority_note: '우선순위', equipment: '장비 세팅', notes: '메모' };

      list.innerHTML = data.map(h => {
        const badge = `<span class="type-badge ${h.type}">${typeLabels[h.type] || h.type}</span>`;
        let detailLine = '';

        if (h.type === 'deck') {
          // 기존 덱 수정: 어떤 필드가 바뀌었는지 비교해서 표시
          const changedFields = [];
          for (const key in fieldLabels) {
            const beforeVal = JSON.stringify((h.before || {})[key] || (key === 'counter_decks' ? [] : ''));
            const afterVal = JSON.stringify((h.after || {})[key] || (key === 'counter_decks' ? [] : ''));
            if (beforeVal !== afterVal) changedFields.push(fieldLabels[key]);
          }
          detailLine = `변경된 항목: <span class="changed">${changedFields.join(', ') || '없음'}</span>`;
        } else if (h.type === 'deck_create') {
          detailLine = `<span class="changed">새 덱이 추가되었습니다.</span>`;
        } else if (h.type === 'deck_delete') {
          detailLine = `<span class="changed">덱이 삭제되었습니다.</span>`;
        } else {
          // 메모 / 레이드: 텍스트 저장이라 "내용이 변경됨"으로만 표시
          detailLine = `<span class="changed">내용이 저장되었습니다.</span>`;
        }

        return `
          <div class="correction-item">
            <div class="deck-title">${h.target}${badge}</div>
            <div class="timestamp">${h.timestamp} · ${h.username || '알 수 없음'}</div>
            <div>${detailLine}</div>
          </div>
        `;
      }).join('');
    } catch (e) {
      list.innerHTML = '<div class="empty-state">수정 이력을 불러오지 못했습니다.</div>';
    }
  };

  /* -------------------- 6. 메모장 (admin 전용) -------------------- */
  async function loadMemo() {
    const textarea = document.getElementById('memoTextarea');
    try {
      const res = await fetch('/memo');
      const data = await res.json();
      textarea.value = data.content || '';
    } catch (e) {}
  }
  window.loadMemo = loadMemo;

  document.getElementById('saveMemoBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveMemoBtn');
    const status = document.getElementById('memoStatus');
    const { username, password } = getAuth();
    btn.disabled = true;
    status.textContent = '';

    try {
      const res = await fetch('/memo', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: document.getElementById('memoTextarea').value,
          username: username,
          password: password
        })
      });
      if (!res.ok) throw new Error();
      status.textContent = '저장되었습니다.';
      status.style.color = 'var(--ok)';
    } catch (e) {
      status.textContent = '저장에 실패했습니다.';
      status.style.color = 'var(--danger)';
    } finally {
      btn.disabled = false;
    }
  });

  /* -------------------- 7. 레이드 공략 (강림 / 파괴신 / 돌발레이드) -------------------- */

  // /raid 데이터를 최초 1회만 불러와서 캐싱
  async function loadRaidData() {
    if (!raidDataCache) {
      const res = await fetch('/raid');
      raidDataCache = await res.json();
    }
  }

  // "list" 타입 카테고리 (강림, 돌발레이드): 왼쪽 보스 목록 렌더링
  window.loadRaidList = async function(category) {
    await loadRaidData();
    const listEl = document.getElementById('raidList-' + category);
    const bosses = raidDataCache[category].bosses;

    listEl.innerHTML = Object.keys(bosses).map(name =>
      `<div class="deck-list-item" data-boss="${name}">${name}</div>`
    ).join('');

    listEl.querySelectorAll('.deck-list-item').forEach(item => {
      item.addEventListener('click', () => {
        listEl.querySelectorAll('.deck-list-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        renderRaidBossDetail(category, item.dataset.boss);
      });
    });
  };

  // 보스 선택 시 오른쪽에 편집 가능한 텍스트영역 표시
  function renderRaidBossDetail(category, bossName) {
    const detail = document.getElementById('raidDetail-' + category);
    const content = raidDataCache[category].bosses[bossName] || '';

    detail.innerHTML = `
      <div class="detail-name">${bossName}</div>
      <textarea id="raidBossTextarea" class="plain-textarea" style="min-height:50vh;">${content}</textarea>
      <div class="footer-row">
        <div id="raidBossStatus" style="font-size:12.5px;"></div>
        <button class="save-btn" id="raidBossSaveBtn" style="margin-top:10px;">저장</button>
      </div>
    `;

    document.getElementById('raidBossSaveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('raidBossSaveBtn');
      const status = document.getElementById('raidBossStatus');
      const { username, password } = getAuth();
      btn.disabled = true;
      status.textContent = '';
      try {
        const res = await fetch('/raid/' + encodeURIComponent(category), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            boss: bossName,
            content: document.getElementById('raidBossTextarea').value,
            username: username,
            password: password
          })
        });
        if (!res.ok) throw new Error();
        raidDataCache[category].bosses[bossName] = document.getElementById('raidBossTextarea').value;
        status.textContent = '저장되었습니다.';
        status.style.color = 'var(--ok)';
      } catch (e) {
        status.textContent = '저장에 실패했습니다.';
        status.style.color = 'var(--danger)';
      } finally {
        btn.disabled = false;
      }
    });
  }

  // "single" 타입 카테고리 (파괴신): 목록 없이 바로 텍스트영역 표시
  window.loadRaidSingle = async function(category) {
    await loadRaidData();
    const textarea = document.getElementById('raidSingleTextarea-' + category);
    textarea.value = raidDataCache[category].content || '';
  };

  document.getElementById('raidSingleSaveBtn-파괴신').addEventListener('click', async () => {
    const btn = document.getElementById('raidSingleSaveBtn-파괴신');
    const status = document.getElementById('raidSingleStatus-파괴신');
    const { username, password } = getAuth();
    btn.disabled = true;
    status.textContent = '';
    try {
      const res = await fetch('/raid/파괴신', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: document.getElementById('raidSingleTextarea-파괴신').value,
          username: username,
          password: password
        })
      });
      if (!res.ok) throw new Error();
      raidDataCache['파괴신'].content = document.getElementById('raidSingleTextarea-파괴신').value;
      status.textContent = '저장되었습니다.';
      status.style.color = 'var(--ok)';
    } catch (e) {
      status.textContent = '저장에 실패했습니다.';
      status.style.color = 'var(--danger)';
    } finally {
      btn.disabled = false;
    }
  });

  /* -------------------- 8. 사용자 관리 (admin 전용) -------------------- */

  // 관리자 비밀번호 확인 -> 승인 대기 목록 + 전체 회원 목록을 함께 불러옴
  // "사용자 관리" 탭 진입 시 자동으로 데이터 불러오기 (admin 계정만 이 탭이 보이므로 별도 비밀번호 불필요)
  // "사용자 관리" 탭: 승인 대기 + 전체 회원만
  async function loadAdminData() {
    const { username, password } = getAuth();
    try {
      const [pendingRes, allRes] = await Promise.all([
        fetch(`/pending-users?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`),
        fetch(`/all-users?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`),
      ]);
      const pendingData = await pendingRes.json();
      const allData = await allRes.json();
      if (!pendingRes.ok) throw new Error(pendingData.detail);

      renderPendingUsers(pendingData, username, password);
      renderAllUsers(allData, username, password);
    } catch (e) {
      document.getElementById('pendingList').innerHTML = `<div class="empty-state">${e.message}</div>`;
    }
  }

  // "활동 로그" 탭: 활동 로그만 (계정 목록은 필터용으로 같이 불러옴)
  async function loadActivityLogData() {
    const { username, password } = getAuth();
    try {
      const [allRes, logRes] = await Promise.all([
        fetch(`/all-users?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`),
        fetch(`/activity-log?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`),
      ]);
      const allData = await allRes.json();
      const logData = await logRes.json();
      if (!allRes.ok) throw new Error(allData.detail);

      renderActivityLog(logData, allData, username, password);
    } catch (e) {
      document.getElementById('activityLogList').innerHTML = `<div class="empty-state">${e.message}</div>`;
    }
  }

  // 승인 대기 목록 렌더링: "승인" 버튼 누르면 /approve-user 호출
  function renderPendingUsers(usernames, adminUsername, adminPassword) {
    const listEl = document.getElementById('pendingList');
    if (!usernames.length) {
      listEl.innerHTML = '<div class="empty-state">승인 대기 중인 사용자가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = usernames.map(u => `
      <div class="pending-item">
        <span>${u}</span>
        <button data-username="${u}">승인</button>
      </div>
    `).join('');
    listEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const res = await fetch('/approve-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: btn.dataset.username,
              password: adminPassword,
              admin_username: adminUsername
            })
          });
          if (!res.ok) throw new Error();
          btn.closest('.pending-item').remove();
        } catch (e) {
          btn.disabled = false;
          alert('승인 처리에 실패했습니다.');
        }
      });
    });
  }

  // 전체 회원 목록 렌더링: 승인 상태 표시 + "삭제" 버튼 (admin 계정 본인은 삭제 버튼 숨김)
  function renderAllUsers(users, adminUsername, adminPassword) {
    const listEl = document.getElementById('allUsersList');
    if (!users.length) {
      listEl.innerHTML = '<div class="empty-state">등록된 회원이 없습니다.</div>';
      return;
    }
    listEl.innerHTML = users.map(u => `
      <div class="pending-item">
        <span>${u.username}
          ${u.approved
            ? '<span style="color:var(--ok); font-size:11.5px;">(승인됨)</span>'
            : '<span style="color:var(--text-dim); font-size:11.5px;">(대기중)</span>'}
        </span>
        ${u.username !== 'admin' ? `<button class="danger-btn" data-username="${u.username}">삭제</button>` : ''}
      </div>
    `).join('');
    listEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(btn.dataset.username + ' 계정을 삭제하시겠습니까?')) return;
        btn.disabled = true;
        try {
          const res = await fetch('/revoke-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: btn.dataset.username,
              password: adminPassword,
              admin_username: adminUsername
            })
          });
          if (!res.ok) throw new Error();
          btn.closest('.pending-item').remove();
        } catch (e) {
          btn.disabled = false;
          alert('삭제에 실패했습니다.');
        }
      });
    });
  }

  // 활동 로그 렌더링: 로그인/챗봇 질문/저장 작업 전부 표시, 계정별 드롭다운 필터 지원
  function renderActivityLog(logs, allUsers, adminUsername, adminPassword) {
    const filterEl = document.getElementById('logUserFilter');
    filterEl.innerHTML = '<option value="">전체 계정</option>' +
      allUsers.map(u => `<option value="${u.username}">${u.username}</option>`).join('');

    const typeLabels = { login: '로그인', chat: '챗봇 질문', save: '저장' };

    function render(filteredLogs) {
      const listEl = document.getElementById('activityLogList');
      if (!filteredLogs.length) {
        listEl.innerHTML = '<div class="empty-state">활동 로그가 없습니다.</div>';
        return;
      }
      listEl.innerHTML = filteredLogs.map(l => `
        <div class="correction-item">
          <div class="deck-title">${l.username || '알 수 없음'}<span class="type-badge deck">${typeLabels[l.type] || l.type}</span></div>
          <div class="timestamp">${l.timestamp}</div>
          ${l.detail ? `<div class="detail-field-value">${l.detail}</div>` : ''}
        </div>
      `).join('');
    }

    render(logs);

    filterEl.addEventListener('change', async () => {
      const username = filterEl.value;
      const res = await fetch(`/activity-log?username=${encodeURIComponent(adminUsername)}&password=${encodeURIComponent(adminPassword)}&username_filter=${encodeURIComponent(username)}`);
      const filtered = await res.json();
      render(filtered);
    });
  }
}
</script>

</body>
</html>
