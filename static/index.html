<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세나봇 · 길드전 공략</title>
<style>
  :root {
    --bg: #14151a;
    --panel: #1b1d24;
    --panel-hover: #22242c;
    --border: #2c2f38;
    --gold: #d4a656;
    --gold-dim: #8a6f3d;
    --text: #e8e6e0;
    --text-dim: #8b8d97;
    --danger: #c1584f;
    --ok: #5fa876;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #191a20, #14151a);
  }
  .emblem {
    width: 34px; height: 34px;
    border: 1.5px solid var(--gold);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .emblem::after { content: ""; width: 10px; height: 10px; background: var(--gold); }
  .topbar h1 { font-size: 18px; letter-spacing: 0.02em; margin: 0; font-weight: 600; }
  .topbar .sub { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }

  .tabs {
    display: flex; gap: 2px; padding: 0 28px;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .tab {
    padding: 13px 18px; color: var(--text-dim); cursor: pointer;
    font-size: 14px; border-bottom: 2px solid transparent; user-select: none; transition: color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 28px; }
  .view { display: none; }
  .view.active { display: block; }

  /* 마스터-디테일 레이아웃 (가이드 보기 / 덱 수정 공용) */
  .split {
    display: flex;
    gap: 16px;
    height: 68vh;
  }
  .deck-list {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-y: auto;
  }
  .deck-list-item {
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .deck-list-item:hover { background: var(--panel-hover); color: var(--text); }
  .deck-list-item.selected {
    background: var(--panel-hover);
    color: var(--gold);
    border-left: 2px solid var(--gold);
  }
  .search-box {
    padding: 10px;
    border-bottom: 1px solid var(--border);
  }
  .search-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 12.5px;
  }
  .search-box input:focus { outline: none; border-color: var(--gold-dim); }

  .detail-panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px 24px;
    overflow-y: auto;
  }
  .detail-empty { color: var(--text-dim); font-size: 13.5px; text-align: center; margin-top: 40%; }
  .detail-name { color: var(--gold); font-size: 19px; font-weight: 600; margin-bottom: 18px; }
  .detail-field { margin-bottom: 18px; }
  .detail-field-label { color: var(--text); font-size: 12.5px; font-weight: 600; margin-bottom: 6px; letter-spacing: .02em; }
  .detail-field-value { color: var(--text-dim); font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--panel-hover);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12.5px;
    color: var(--text);
  }

  /* 덱 수정 폼 */
  .edit-form label { display: block; color: var(--text); font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  .edit-form label:first-child { margin-top: 0; }
  .edit-form input[type=text], .edit-form textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 9px 11px;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    resize: vertical;
  }
  .edit-form input:focus, .edit-form textarea:focus { outline: none; border-color: var(--gold-dim); }
  .edit-form .field-hint { color: var(--text-dim); font-size: 11.5px; margin-top: 4px; }
  .save-btn {
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    border-radius: 5px;
    padding: 10px 24px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    margin-top: 18px;
  }
  .save-btn:disabled { opacity: .5; cursor: default; }
  .save-status { font-size: 12.5px; margin-top: 10px; }
  .save-status.ok { color: var(--ok); }
  .save-status.err { color: var(--danger); }

  /* 챗봇 뷰 */
  .chat-log {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    height: 55vh; overflow-y: auto; padding: 18px; margin-bottom: 12px;
  }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .msg.user .bubble { background: var(--gold-dim); color: #1a1a1a; }
  .msg.bot .bubble { background: var(--panel-hover); border: 1px solid var(--border); }
  .msg.bot .bubble.pending { color: var(--text-dim); font-style: italic; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    padding: 12px 14px; color: var(--text); font-size: 14px;
  }
  .chat-input-row input:focus { outline: none; border-color: var(--gold-dim); }
  .chat-input-row button {
    background: var(--gold); color: #1a1a1a; border: none; border-radius: 5px;
    padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .chat-input-row button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    padding: 4px 10px; border-radius: 4px; font-size: 11.5px; cursor: pointer; flex-shrink: 0;
  }
  .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* 정정내역 뷰 */
  .correction-item {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold-dim);
    border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; font-size: 13.5px;
  }
  .correction-item .wrong { color: var(--danger); text-decoration: line-through; opacity: .8; }
  .correction-item .arrow { color: var(--text-dim); margin: 0 8px; }
  .correction-item .correct { color: var(--ok); }
  .empty-state { color: var(--text-dim); font-size: 13.5px; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div id="lockScreen" style="
  position: fixed; inset: 0; background: #14151a;
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; flex-direction: column; gap: 16px;
">
  <div style="color: #d4a656; font-size: 20px; font-weight: 600;">세나봇 접속</div>
  <input id="lockPasswordInput" type="password" placeholder="길드 비밀번호"
    style="background: #1b1d24; border: 1px solid #2c2f38; border-radius: 5px;
    padding: 12px 16px; color: #e8e6e0; font-size: 14px; width: 240px; text-align: center;" />
  <button id="lockSubmitBtn" style="
    background: #d4a656; color: #1a1a1a; border: none; border-radius: 5px;
    padding: 10px 24px; font-weight: 600; font-size: 14px; cursor: pointer;
  ">입장</button>
  <div id="lockError" style="color: #c1584f; font-size: 12.5px; min-height: 16px;"></div>
</div> 

<div id="appContent" style="display: none;">
  <div class="topbar">
    <div class="emblem"></div>
    <div>
      <h1>세나봇</h1>
      <div class="sub">길드전 공격팀 세팅 가이드 · 질의응답 &amp; 수정</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="chat">챗봇</div>
    <div class="tab" data-view="guide">가이드 보기</div>
    <div class="tab" data-view="edit">덱 수정</div>
    <div class="tab" data-view="corrections">정정 내역</div>
  </div>

  <main>

    <section id="view-chat" class="view active">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="예: 밀실스 카운터 조합 알려줘" />
        <button id="sendBtn">전송</button>
      </div>
      <div class="hint">
        <span>챗봇 대화 중 정정된 내용은 "정정 내역" 탭에서, 덱 정보 자체를 고치려면 "덱 수정" 탭을 이용하세요.</span>
        <button class="clear-btn" id="clearChatBtn">대화 지우기</button>
      </div>
    </section>

    <section id="view-guide" class="view">
      <div class="split">
        <div class="deck-list">
          <div class="search-box"><input id="guideSearch" type="text" placeholder="덱 이름 검색... (순서 상관없음)" /></div>
          <div id="guideListItems"></div>
        </div>
        <div class="detail-panel" id="guideDetail">
          <div class="detail-empty">왼쪽에서 덱을 선택하세요</div>
        </div>
      </div>
    </section>

    <section id="view-edit" class="view">
      <div class="split">
        <div class="deck-list">
          <div class="search-box"><input id="editSearch" type="text" placeholder="덱 이름 검색... (순서 상관없음)" /></div>
          <div id="editListItems"></div>
        </div>
        <div class="detail-panel" id="editDetail">
          <div class="detail-empty">왼쪽에서 수정할 덱을 선택하세요</div>
        </div>
      </div>
    </section>

    <section id="view-corrections" class="view">
      <div id="correctionsList"></div>
    </section>

  </main>
</div>

<script>
// ---- 접속 비밀번호 확인 ----
async function checkAccess() {
  const savedPw = sessionStorage.getItem('sena_bot_access_password');
  if (savedPw) {
    const ok = await tryPassword(savedPw, false);
    if (ok) {
      showApp();
      return;
    }
  }
  document.getElementById('lockScreen').style.display = 'flex';
}

async function tryPassword(password, showErrorOnFail = true) {
  try {
    const res = await fetch('/verify-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (res.ok) {
      sessionStorage.setItem('sena_bot_access_password', password);
      localStorage.setItem('sena_bot_password', password); // 덱 수정 탭에서도 같은 비번 재사용
      return true;
    }
  } catch (e) {}
  if (showErrorOnFail) {
    document.getElementById('lockError').textContent = '비밀번호가 올바르지 않습니다.';
  }
  return false;
}

function showApp() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
}

document.getElementById('lockSubmitBtn').addEventListener('click', async () => {
  const pw = document.getElementById('lockPasswordInput').value;
  const ok = await tryPassword(pw);
  if (ok) showApp();
});
document.getElementById('lockPasswordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) {
    document.getElementById('lockSubmitBtn').click();
  }
});

checkAccess();

let guideDataCache = null;

const tabs = document.querySelectorAll('.tab');
const views = document.querySelectorAll('.view');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    views.forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
    if (tab.dataset.view === 'guide') loadGuide('guide');
    if (tab.dataset.view === 'edit') loadGuide('edit');
    if (tab.dataset.view === 'corrections') loadCorrections();
  });
});

// ---- 챗봇 ----
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const clearChatBtn = document.getElementById('clearChatBtn');

function saveChatHistory() {
  localStorage.setItem('sena_bot_chat_history', chatLog.innerHTML);
}

function loadChatHistory() {
  const saved = localStorage.getItem('sena_bot_chat_history');
  if (saved) {
    chatLog.innerHTML = saved;
    chatLog.scrollTop = chatLog.scrollHeight;
  }
}
loadChatHistory();

clearChatBtn.addEventListener('click', () => {
  chatLog.innerHTML = '';
  localStorage.removeItem('sena_bot_chat_history');
});

function addMessage(text, who, pending = false) {
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (pending ? ' pending' : '');
  bubble.textContent = text;
  row.appendChild(bubble);
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  saveChatHistory();
  return bubble;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  sendBtn.disabled = true;
  addMessage(text, 'user');
  const pendingBubble = addMessage('생각 중...', 'bot', true);

  // 30초 이상 응답 없으면 타임아웃 처리
  const timeoutId = setTimeout(() => {
    pendingBubble.textContent = '응답 시간이 초과됐습니다. 서버가 혼잡할 수 있어요. 잠시 후 다시 시도해주세요.';
    pendingBubble.classList.remove('pending');
    saveChatHistory();
    sendBtn.disabled = false;
  }, 30000);

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('서버 오류: ' + res.status);
    const data = await res.json();
    pendingBubble.textContent = data.answer;
    pendingBubble.classList.remove('pending');
  } catch (e) {
    clearTimeout(timeoutId);
    pendingBubble.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해주세요. (' + e.message + ')';
    pendingBubble.classList.remove('pending');
  } finally {
    saveChatHistory();
    sendBtn.disabled = false;
  }
}
sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) {
    sendMessage();
  }
});

// ---- 가이드 데이터 로드 (가이드 보기 / 덱 수정 공용) ----
async function loadGuide(mode) {
  if (!guideDataCache) {
    const res = await fetch('/guide');
    const data = await res.json();
    guideDataCache = data.guide_data;
  }
  renderDeckList(mode);
}

function normalize(str) {
  return str.split('').sort().join('');
}

function renderDeckList(mode) {
  const listEl = document.getElementById(mode === 'guide' ? 'guideListItems' : 'editListItems');
  const searchEl = document.getElementById(mode === 'guide' ? 'guideSearch' : 'editSearch');
  const keyword = (searchEl.value || '').trim();
  const normalizedKeyword = normalize(keyword);

  const names = Object.keys(guideDataCache).filter(n =>
    n.includes(keyword) || (normalizedKeyword && normalize(n).includes(normalizedKeyword))
  ).sort();

  listEl.innerHTML = names.map(name =>
    `<div class="deck-list-item" data-deck="${name}">${name}</div>`
  ).join('') || '<div class="empty-state">일치하는 덱이 없습니다.</div>';

  listEl.querySelectorAll('.deck-list-item').forEach(item => {
    item.addEventListener('click', () => {
      listEl.querySelectorAll('.deck-list-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      if (mode === 'guide') renderGuideDetail(item.dataset.deck);
      else renderEditForm(item.dataset.deck);
    });
  });
}

document.getElementById('guideSearch').addEventListener('input', () => renderDeckList('guide'));
document.getElementById('editSearch').addEventListener('input', () => renderDeckList('edit'));

function renderGuideDetail(deckName) {
  const d = guideDataCache[deckName];
  const detail = document.getElementById('guideDetail');
  const counters = d.counter_decks && d.counter_decks.length
    ? `<div class="chip-row">${d.counter_decks.map(c => `<span class="chip">${c}</span>`).join('')}</div>`
    : '<div class="detail-field-value">-</div>';

  detail.innerHTML = `
    <div class="detail-name">${deckName}</div>
    <div class="detail-field">
      <div class="detail-field-label">카운터 조합</div>
      ${counters}
    </div>
    <div class="detail-field">
      <div class="detail-field-label">우선순위</div>
      <div class="detail-field-value">${d.priority_note || '-'}</div>
    </div>
    <div class="detail-field">
      <div class="detail-field-label">장비 세팅</div>
      <div class="detail-field-value">${d.equipment || '-'}</div>
    </div>
    <div class="detail-field">
      <div class="detail-field-label">메모</div>
      <div class="detail-field-value">${d.notes || '-'}</div>
    </div>
  `;
}

function renderEditForm(deckName) {
  const d = guideDataCache[deckName];
  const detail = document.getElementById('editDetail');
  const counterText = (d.counter_decks || []).join(', ');

  detail.innerHTML = `
    <div class="detail-name">${deckName}</div>
    <div class="edit-form">
      <label>카운터 조합</label>
      <input type="text" id="f-counters" value="${counterText.replace(/"/g, '&quot;')}" />
      <div class="field-hint">쉼표(,)로 구분해서 입력하세요</div>

      <label>우선순위</label>
      <textarea id="f-priority" rows="2">${d.priority_note || ''}</textarea>

      <label>장비 세팅</label>
      <textarea id="f-equipment" rows="2">${d.equipment || ''}</textarea>

      <label>메모</label>
      <textarea id="f-notes" rows="4">${d.notes || ''}</textarea>

      <button class="save-btn" id="saveDeckBtn">저장</button>
      <div class="save-status" id="saveStatus"></div>
    </div>
  `;

  document.getElementById('saveDeckBtn').addEventListener('click', () => saveDeck(deckName));
}

function getPassword() {
  let pw = localStorage.getItem('sena_bot_password');
  if (!pw) {
    pw = prompt('길드 비밀번호를 입력하세요:');
    if (pw) localStorage.setItem('sena_bot_password', pw);
  }
  return pw;
}

async function saveDeck(deckName) {
  const btn = document.getElementById('saveDeckBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  status.textContent = '';

  const password = getPassword();
  if (!password) {
    status.textContent = '비밀번호를 먼저 입력해주세요.';
    status.className = 'save-status err';
    btn.disabled = false;
    return;
  }

  const payload = {
    counter_decks: document.getElementById('f-counters').value.split(',').map(s => s.trim()).filter(Boolean),
    priority_note: document.getElementById('f-priority').value,
    equipment: document.getElementById('f-equipment').value,
    notes: document.getElementById('f-notes').value,
    password: password,
  };

  try {
    const res = await fetch('/guide/' + encodeURIComponent(deckName), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      if (res.status === 403) throw new Error('비밀번호가 틀렸습니다.');
      throw new Error();
    }
    guideDataCache[deckName] = payload;
    status.textContent = '저장되었습니다.';
    status.className = 'save-status ok';
  } catch (e) {
    status.textContent = e.message || '저장에 실패했습니다.';
    status.className = 'save-status err';
  } finally {
    btn.disabled = false;
  }
}

// ---- 정정 내역 ----
async function loadCorrections() {
  const list = document.getElementById('correctionsList');
  list.textContent = '불러오는 중...';
  try {
    const res = await fetch('/corrections');
    const data = await res.json();
    if (!data.length) {
      list.innerHTML = '<div class="empty-state">아직 정정된 내용이 없습니다.</div>';
      return;
    }
    list.innerHTML = data.map(c => `
      <div class="correction-item">
        <span class="wrong">${c.wrong_info}</span>
        <span class="arrow">→</span>
        <span class="correct">${c.correct_info}</span>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty-state">정정 내역을 불러오지 못했습니다.</div>';
  }
}
</script>

</body>
</html>
